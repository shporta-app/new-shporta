<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; background: #14121F; color: #fff; font-family: "Bricolage Grotesque", sans-serif; }
.in { padding: 78px 84px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 20px; }
.brand svg { width: 84px; height: 84px; }
.word { font-weight: 800; font-size: 76px; letter-spacing: -.045em; line-height: 1; display: inline-flex; align-items: baseline; }
.o { display: inline-block; width: .56em; height: .56em; border-radius: 50%; border: .13em solid #C6F432; box-sizing: border-box; margin: 0 .015em 0 .02em; }
h1 { margin: auto 0 0; font-size: 70px; line-height: 1.04; letter-spacing: -.03em; font-weight: 800; }
h1 span { color: #C6F432; }
p { margin: 26px 0 0; font-size: 28px; color: #A7A2B8; font-weight: 500; }
</style></head>
<body><div class="in">
  <div class="brand">{MARK}<span class="word">shp<i class="o"></i>rta</span></div>
  <h1>I njëjti produkt.<br><span>Çmimi më i mirë në Shqipëri.</span></h1>
  <p>Krahaso çmimet në dyqanet online shqiptare, çdo ditë. shporta.app</p>
</div></body></html>
