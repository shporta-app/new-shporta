# Keeps shporta.app awake. Render's free plan stops the server after 15 minutes without visits, and the next
# visitor then waits 30-60 seconds while it starts. One server running all month (~744 h) fits in the free 750 h.
# GitHub may run scheduled jobs a few minutes late, hence every 5 minutes.
name: keep awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://shporta.app/api/health
