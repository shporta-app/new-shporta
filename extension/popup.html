<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>shporta</title>
<style>
  :root { --ink:#14121F; --paper:#fff; --soft:#F6F5F9; --line:#E7E5EE; --muted:#6E6A7C; --violet:#7B4DFF; --lime:#C6F432; }
  @media (prefers-color-scheme: dark) { :root { --ink:#F1EFF7; --paper:#1B1829; --soft:#241F38; --line:#2C2840; --muted:#A7A2B8; --violet:#A58BFF; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 330px; background: var(--paper); color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  header strong { font: 800 18px/1 system-ui, sans-serif; letter-spacing: -.02em; }
  main { padding: 0 16px 14px; }
  form { display: flex; gap: 6px; margin-bottom: 12px; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; }
  input:focus { outline: none; border-color: var(--violet); }
  button, .btn { font: 700 13px/1 system-ui, sans-serif; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; text-decoration: none; text-align: center; }
  .pri { background: var(--violet); color: #fff; }
  .sec { background: var(--soft); color: var(--ink); }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 4px; line-height: 1.3; }
  .card .big { font: 800 20px/1.1 system-ui, sans-serif; margin: 4px 0; }
  .card .big.save { background: var(--lime); color: #14121F; display: inline-block; padding: 2px 8px; border-radius: 8px; }
  .muted { color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .row a { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; background: var(--soft); color: var(--ink); text-decoration: none; font-weight: 600; }
  .row svg { width: 22px; height: 22px; }
  .site { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); }
  .site label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .site.share { margin-top: 10px; align-items: flex-start; color: var(--ink); }
  .site.share small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt=""><strong>shporta</strong></header>
<main>
  <div id="here"></div>
  <form id="q"><input name="q" placeholder="Kërko një produkt ose markë" autocomplete="off" autofocus><button class="pri">Kërko</button></form>
  <div class="row">
    <a href="https://shporta.app/skano" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>Skano</a>
    <a href="https://shporta.app/shporta" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L20.5 9H6.2"/><circle cx="9.5" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>Shporta ime</a>
    <a href="https://shporta.app/lista" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg>Lista ime</a>
  </div>
  <div class="site" id="site" hidden><span id="site-name"></span><label><input type="checkbox" id="site-on"> Shfaq këtu</label></div>
  <div class="site share"><span>Ndaj çmimet e dyqaneve që shporta s'i lexon dot<br><small>Vetëm emri, çmimi, barkodi dhe adresa e produktit. Asgjë për ty.</small></span><label><input type="checkbox" id="share-on"> Po</label></div>
</main>
<script src="popup.js"></script>
</body>
</html>
